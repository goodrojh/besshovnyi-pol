<style>
  :root {
    --ink:#0f1820; --ink-2:#44525e; --ink-3:#74828e;
    --line:#e3e9ee; --line-2:#d2dbe2; --bg:#f4f7fa; --panel:#fff;
    --accent:#1f5fd4; --accent-2:#1545a0; --accent-soft:#e9f0fc;
    --warn:#b42318; --warn-soft:#fef3f2; --ok:#067647; --ok-soft:#ecfdf3;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
         color:var(--ink); background:var(--bg); }
  .wrap { max-width:1280px; margin:0 auto; padding:18px; }

  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:21px; letter-spacing:-.02em; }
  .who { font-size:13px; color:var(--ink-3); margin-left:auto; }

  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  input, select, textarea, button { font:inherit; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    border:1.5px solid var(--line-2); border-radius:9px; padding:8px 10px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { width:100%; min-height:70px; resize:vertical; }
  button {
    border:none; border-radius:9px; padding:9px 15px; cursor:pointer; font-weight:600;
    background:var(--accent); color:#fff;
  }
  button:hover { background:var(--accent-2); }
  button.ghost { background:#fff; color:var(--ink); border:1.5px solid var(--line-2); }
  button.ghost:hover { background:var(--bg); }
  button:disabled { opacity:.5; cursor:default; }

  .chip { border:1.5px solid var(--line-2); background:#fff; border-radius:999px;
          padding:6px 13px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-2); }
  .chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  /* вкладки-папки, как в телеграме */
  .tabs { display:flex; gap:4px; margin-bottom:14px; overflow-x:auto; scrollbar-width:none;
          border-bottom:1px solid var(--line); }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; background:none; border:none; border-radius:0; color:var(--ink-3);
         font-weight:600; font-size:14.5px; padding:10px 14px; cursor:pointer; white-space:nowrap;
         border-bottom:2.5px solid transparent; margin-bottom:-1px; }
  .tab:hover { background:none; color:var(--ink); }
  .tab.on { color:var(--ink); border-bottom-color:var(--accent); }
  .tab .n { display:inline-block; margin-left:6px; font-size:12.5px; font-weight:700;
            color:var(--ink-3); background:var(--bg-2,#eef2f6); border-radius:999px; padding:1px 7px; }
  .tab.on .n { background:var(--accent-soft); color:var(--accent-2); }
  .tab.alarm { color:var(--warn); }
  .tab.alarm .n { background:var(--warn-soft); color:var(--warn); }
  .tab.alarm.on { border-bottom-color:var(--warn); }


  table { width:100%; border-collapse:collapse; background:var(--panel);
          border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  th { background:#f8fafc; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); }
  tr.row { cursor:pointer; }
  tr.row:hover td { background:#f8fbff; }
  tr.overdue td:first-child { box-shadow:inset 3px 0 0 var(--warn); }
  .muted { color:var(--ink-3); font-size:13px; }
  .nowrap { white-space:nowrap; }

  .st { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:600;
        background:var(--accent-soft); color:var(--accent-2); white-space:nowrap; }
  .st.Договор { background:var(--ok-soft); color:var(--ok); }
  .st.Отказ { background:#f3f4f6; color:#6b7280; }
  .st.Новая { background:#fff7e6; color:#b45309; }

  .empty { text-align:center; padding:50px 20px; color:var(--ink-3); background:var(--panel);
           border:1px solid var(--line); border-radius:12px; }

  .modal { position:fixed; inset:0; background:rgba(8,14,20,.55); display:flex;
           align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; z-index:10; }
  .modal[hidden] { display:none; }
  .card { background:var(--panel); border-radius:14px; width:min(720px,100%); padding:22px; margin:auto; }
  .card h2 { font-size:19px; margin-bottom:4px; }
  .card .sub { color:var(--ink-3); font-size:13px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:16px; }
  .f label { display:block; font-size:12.5px; color:var(--ink-3); margin-bottom:5px; font-weight:600; }
  .f input, .f select { width:100%; }
  .facts { background:var(--bg); border-radius:10px; padding:12px 14px; margin-bottom:16px; font-size:14px; }
  .facts div { display:flex; gap:10px; padding:3px 0; }
  .facts b { color:var(--ink-3); font-weight:500; min-width:150px; }
  .notes { white-space:pre-wrap; background:var(--bg); border-radius:10px; padding:12px 14px;
           max-height:220px; overflow-y:auto; font-size:13.5px; line-height:1.55; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .call { display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:17px; color:var(--ink); }
  .card--wide { width:min(1080px,100%); }
  .sect { margin-bottom:22px; }
  .sect h3 { font-size:14px; text-transform:uppercase; letter-spacing:.06em;
             color:var(--ink-3); margin-bottom:10px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { background:var(--bg); border-radius:10px; padding:12px 14px; }
  .kpi b { display:block; font-size:22px; letter-spacing:-.02em; line-height:1.2; }
  .kpi span { font-size:12.5px; color:var(--ink-3); }
  .kpi.warn b { color:var(--warn); }
  .kpi.good b { color:var(--ok); }
  .fun { display:grid; gap:6px; }
  .fun-row { display:grid; grid-template-columns:96px 1fr 130px; align-items:center; gap:10px;
             font-size:13.5px; }
  .fun-bar { background:var(--accent-soft); border-radius:6px; height:26px; position:relative; }
  .fun-bar i { position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:6px;
               display:block; }
  .fun-bar em { position:absolute; left:9px; top:4px; font-style:normal; font-size:13px;
                font-weight:700; color:#fff; mix-blend-mode:difference; }
  .mini { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; align-items:end;
          height:90px; }
  .mini div { background:var(--accent-soft); border-radius:4px 4px 0 0; position:relative;
              min-height:2px; }
  .mini div span { position:absolute; top:100%; left:0; right:0; text-align:center;
                   font-size:10.5px; color:var(--ink-3); padding-top:3px; }
  .mini-wrap { padding-bottom:18px; }
  .scroll-x { overflow-x:auto; }
  .num { text-align:right; white-space:nowrap; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
           background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; z-index:20; }
  .toast[hidden] { display:none; }
  /* выбор каналов в аналитике */
  .picks { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:6px;
           margin-bottom:14px; }
  .pick { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:9px;
          background:var(--bg); font-size:13.5px; cursor:pointer; }
  .pick input { width:17px; height:17px; accent-color:var(--accent); }
  .pick.on { background:var(--accent-soft); }

  /* задачи на день */
  .day-h { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;
           text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); margin:16px 0 8px; }
  .day-h.warn { color:var(--warn); }
  .task { display:flex; align-items:center; gap:12px; padding:11px 13px; background:var(--bg);
          border-radius:11px; margin-bottom:7px; cursor:pointer; }
  .task:hover { background:var(--accent-soft); }
  .task.late { box-shadow:inset 3px 0 0 var(--warn); }
  .task b { display:block; font-size:14.5px; }
  .task .muted { font-size:13px; }
  .task .when { margin-left:auto; font-size:13px; color:var(--ink-3); white-space:nowrap; }
  .task .tel { flex:none; width:38px; height:38px; border-radius:50%; background:var(--accent);
               color:#fff; display:flex; align-items:center; justify-content:center;
               text-decoration:none; font-size:17px; }

  @media (max-width:760px) {
    .wrap { padding:10px 12px calc(14px + env(safe-area-inset-bottom)); }
    header { position:sticky; top:0; z-index:5; background:var(--bg); margin:0 -12px 10px;
             padding:calc(8px + env(safe-area-inset-top)) 12px 8px; gap:8px; }
    h1 { font-size:18px; width:100%; margin-bottom:2px; }
    .who { display:none; }
    header button { flex:1; min-width:0; padding:11px 10px; font-size:14px; }
    .tabs { margin:0 -12px 12px; padding:0 12px; }
    .tab { padding:12px 13px; }
    .bar > input[type=text] { flex:1 1 100%; }

    /* строки таблицы превращаются в карточки */
    table, thead, tbody, tr, td { display:block; }
    table { border:none; background:none; }
    thead { display:none; }
    tbody tr { background:var(--panel); border:1px solid var(--line); border-radius:12px;
               margin-bottom:9px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
    tr.overdue td:first-child { box-shadow:none; }
    tbody tr.overdue { border-color:var(--warn); }
    td { border:none; padding:2px 0; display:flex; gap:10px; font-size:14px; }
    td::before { content:attr(data-label); color:var(--ink-3); font-size:13px; flex:none;
                 min-width:92px; }
    td.head { order:-1; margin-bottom:4px; }
    td.head::before { display:none; }
    td.hide-sm { display:flex; }
    td:empty { display:none; }

    /* модалки — снизу, как в мобильных приложениях */
    .modal { padding:0; align-items:flex-end; }
    .card { border-radius:16px 16px 0 0; width:100%; max-height:92vh; overflow-y:auto;
            padding:18px 16px calc(18px + env(safe-area-inset-bottom)); margin:0; }
    .card--wide { width:100%; }
    .grid { grid-template-columns:1fr 1fr; gap:10px; }
    .f textarea, .f input, .f select { font-size:16px; }  /* меньше 16px — iOS зумит страницу */
    input[type=text], input[type=date], input[type=number], select, textarea { font-size:16px; }
    .actions { position:sticky; bottom:0; background:var(--panel); padding-top:12px;
               margin:12px -16px calc(-18px - env(safe-area-inset-bottom));
               padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .actions button { flex:1; padding:12px; }
    .kpis { grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); }
    .kpi b { font-size:19px; }
    .fun-row { grid-template-columns:78px 1fr; }
    .fun-row > span:last-child { grid-column:2; font-size:12px; }
    .picks { grid-template-columns:1fr 1fr; }
    .facts b { min-width:104px; }
  }
</style>
