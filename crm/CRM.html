<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<base target="_top">
<style>
  :root {
    --ink:#0f1820; --ink-2:#44525e; --ink-3:#74828e;
    --line:#e3e9ee; --line-2:#d2dbe2; --bg:#f4f7fa; --panel:#fff;
    --accent:#1f5fd4; --accent-2:#1545a0; --accent-soft:#e9f0fc;
    --warn:#b42318; --warn-soft:#fef3f2; --ok:#067647; --ok-soft:#ecfdf3;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
         color:var(--ink); background:var(--bg); }
  .wrap { max-width:1280px; margin:0 auto; padding:18px; }

  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  h1 { font-size:21px; letter-spacing:-.02em; }
  .who { font-size:13px; color:var(--ink-3); margin-left:auto; }

  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  input, select, textarea, button { font:inherit; }
  input[type=text], input[type=date], input[type=number], select, textarea {
    border:1.5px solid var(--line-2); border-radius:9px; padding:8px 10px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { width:100%; min-height:70px; resize:vertical; }
  button {
    border:none; border-radius:9px; padding:9px 15px; cursor:pointer; font-weight:600;
    background:var(--accent); color:#fff;
  }
  button:hover { background:var(--accent-2); }
  button.ghost { background:#fff; color:var(--ink); border:1.5px solid var(--line-2); }
  button.ghost:hover { background:var(--bg); }
  button:disabled { opacity:.5; cursor:default; }

  .chip { border:1.5px solid var(--line-2); background:#fff; border-radius:999px;
          padding:6px 13px; font-size:13.5px; font-weight:600; cursor:pointer; color:var(--ink-2); }
  .chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  /* вкладки-папки, как в телеграме */
  .tabs { display:flex; gap:4px; margin-bottom:14px; overflow-x:auto; scrollbar-width:none;
          border-bottom:1px solid var(--line); }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; background:none; border:none; border-radius:0; color:var(--ink-3);
         font-weight:600; font-size:14.5px; padding:10px 14px; cursor:pointer; white-space:nowrap;
         border-bottom:2.5px solid transparent; margin-bottom:-1px; }
  .tab:hover { background:none; color:var(--ink); }
  .tab.on { color:var(--ink); border-bottom-color:var(--accent); }
  .tab .n { display:inline-block; margin-left:6px; font-size:12.5px; font-weight:700;
            color:var(--ink-3); background:var(--bg-2,#eef2f6); border-radius:999px; padding:1px 7px; }
  .tab.on .n { background:var(--accent-soft); color:var(--accent-2); }
  .tab.alarm { color:var(--warn); }
  .tab.alarm .n { background:var(--warn-soft); color:var(--warn); }
  .tab.alarm.on { border-bottom-color:var(--warn); }


  table { width:100%; border-collapse:collapse; background:var(--panel);
          border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  th { background:#f8fafc; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-3); }
  tr.row { cursor:pointer; }
  tr.row:hover td { background:#f8fbff; }
  tr.overdue td:first-child { box-shadow:inset 3px 0 0 var(--warn); }
  .muted { color:var(--ink-3); font-size:13px; }
  .nowrap { white-space:nowrap; }

  .st { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:600;
        background:var(--accent-soft); color:var(--accent-2); white-space:nowrap; }
  .st.Договор { background:var(--ok-soft); color:var(--ok); }
  .st.Отказ { background:#f3f4f6; color:#6b7280; }
  .st.Новая { background:#fff7e6; color:#b45309; }

  .empty { text-align:center; padding:50px 20px; color:var(--ink-3); background:var(--panel);
           border:1px solid var(--line); border-radius:12px; }

  .modal { position:fixed; inset:0; background:rgba(8,14,20,.55); display:flex;
           align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; z-index:10; }
  .modal[hidden] { display:none; }
  .card { background:var(--panel); border-radius:14px; width:min(720px,100%); padding:22px; margin:auto; }
  .card h2 { font-size:19px; margin-bottom:4px; }
  .card .sub { color:var(--ink-3); font-size:13px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:16px; }
  .f label { display:block; font-size:12.5px; color:var(--ink-3); margin-bottom:5px; font-weight:600; }
  .f input, .f select { width:100%; }
  .facts { background:var(--bg); border-radius:10px; padding:12px 14px; margin-bottom:16px; font-size:14px; }
  .facts div { display:flex; gap:10px; padding:3px 0; }
  .facts b { color:var(--ink-3); font-weight:500; min-width:150px; }
  .notes { white-space:pre-wrap; background:var(--bg); border-radius:10px; padding:12px 14px;
           max-height:220px; overflow-y:auto; font-size:13.5px; line-height:1.55; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .call { display:inline-flex; align-items:center; gap:7px; font-weight:700; font-size:17px; color:var(--ink); }
  .card--wide { width:min(1080px,100%); }
  .sect { margin-bottom:22px; }
  .sect h3 { font-size:14px; text-transform:uppercase; letter-spacing:.06em;
             color:var(--ink-3); margin-bottom:10px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .kpi { background:var(--bg); border-radius:10px; padding:12px 14px; }
  .kpi b { display:block; font-size:22px; letter-spacing:-.02em; line-height:1.2; }
  .kpi span { font-size:12.5px; color:var(--ink-3); }
  .kpi.warn b { color:var(--warn); }
  .kpi.good b { color:var(--ok); }
  .fun { display:grid; gap:6px; }
  .fun-row { display:grid; grid-template-columns:96px 1fr 130px; align-items:center; gap:10px;
             font-size:13.5px; }
  .fun-bar { background:var(--accent-soft); border-radius:6px; height:26px; position:relative; }
  .fun-bar i { position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:6px;
               display:block; }
  .fun-bar em { position:absolute; left:9px; top:4px; font-style:normal; font-size:13px;
                font-weight:700; color:#fff; mix-blend-mode:difference; }
  .mini { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; align-items:end;
          height:90px; }
  .mini div { background:var(--accent-soft); border-radius:4px 4px 0 0; position:relative;
              min-height:2px; }
  .mini div span { position:absolute; top:100%; left:0; right:0; text-align:center;
                   font-size:10.5px; color:var(--ink-3); padding-top:3px; }
  .mini-wrap { padding-bottom:18px; }
  .scroll-x { overflow-x:auto; }
  .num { text-align:right; white-space:nowrap; }
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
           background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:14px; z-index:20; }
  .toast[hidden] { display:none; }
  @media (max-width:720px) {
    .hide-sm { display:none; }
    .wrap { padding:12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Заявки</h1>
    <button id="addBtn">+ Добавить заявку</button>
    <button class="ghost" id="sumBtn">Аналитика</button>
    <span class="who" id="who"></span>
  </header>
  <div class="tabs" id="tabs"></div>

  <div class="bar">
    <input type="text" id="q" placeholder="Поиск: имя, телефон, заметка" style="min-width:230px">
    <select id="fSource"><option value="">Все источники</option></select>
    <button class="ghost" id="reload">Обновить</button>
  </div>

  <div id="list"><div class="empty">Загружаю…</div></div>
</div>

<!-- карточка клиента -->
<div class="modal" id="cardModal" hidden>
  <div class="card">
    <h2 id="cName">—</h2>
    <div class="sub" id="cMeta"></div>

    <a class="call" id="cCall" href="#">—</a>

    <div class="facts" id="cFacts"></div>

    <div class="grid">
      <div class="f"><label>Статус</label><select id="cStatus"></select></div>
      <div class="f"><label>Сумма сделки, ₽</label><input type="number" id="cSum" min="0" step="1000"></div>
      <div class="f"><label>Связаться</label><input type="date" id="cNext"></div>
      <div class="f"><label>Ответственный</label><input type="text" id="cOwner" placeholder="Наталья"></div>
      <div class="f"><label>Причина отказа</label><select id="cReason"></select></div>
      <div class="f"><label>Целевая заявка</label>
        <select id="cTarget">
          <option value="">не размечена</option>
          <option>Да</option>
          <option>Нет</option>
        </select>
      </div>
    </div>

    <div class="f" style="margin-bottom:10px">
      <label>Новая заметка</label>
      <textarea id="cNote" placeholder="Что обсудили, о чём договорились"></textarea>
    </div>
    <div class="notes" id="cNotes">Заметок пока нет.</div>

    <div class="actions">
      <button id="cSave">Сохранить</button>
      <button class="ghost" id="cAddNote">Добавить заметку</button>
      <button class="ghost" id="cClose" style="margin-left:auto">Закрыть</button>
    </div>
  </div>
</div>

<!-- новая заявка вручную -->
<div class="modal" id="newModal" hidden>
  <div class="card">
    <h2>Новая заявка</h2>
    <div class="sub">Для обращений из Telegram, MAX или по телефону</div>
    <div class="grid">
      <div class="f"><label>Имя</label><input type="text" id="nName"></div>
      <div class="f"><label>Телефон *</label><input type="text" id="nPhone" placeholder="+7 (___) ___-__-__"></div>
      <div class="f"><label>Источник</label><select id="nSource"></select></div>
      <div class="f"><label>Тип объекта</label><input type="text" id="nType" placeholder="Склад, цех, паркинг"></div>
      <div class="f"><label>Площадь, м²</label><input type="number" id="nArea" min="0"></div>
    </div>
    <div class="f" style="margin-bottom:10px">
      <label>Комментарий</label>
      <textarea id="nComment" placeholder="Что просит клиент"></textarea>
    </div>
    <div class="actions">
      <button id="nSave">Создать</button>
      <button class="ghost" id="nClose" style="margin-left:auto">Отмена</button>
    </div>
  </div>
</div>

<!-- сводка -->
<div class="modal" id="sumModal" hidden>
  <div class="card card--wide">
    <h2>Аналитика</h2>
    <div class="sub">Считается по заявкам, созданным за выбранный период</div>

    <div class="bar" style="margin-bottom:12px">
      <button class="chip on" data-period="30">30 дней</button>
      <button class="chip" data-period="7">7 дней</button>
      <button class="chip" data-period="0">Сегодня</button>
      <button class="chip" data-period="month">Этот месяц</button>
      <button class="chip" data-period="all">Всё время</button>
    </div>
    <div class="bar" style="margin-bottom:14px">
      <label class="muted" style="align-self:center">с</label>
      <input type="date" id="sFrom">
      <label class="muted" style="align-self:center">по</label>
      <input type="date" id="sTo">
      <button class="ghost" id="sApply">Показать</button>
    </div>

    <div id="sumBody">Считаю…</div>
    <div class="actions"><button class="ghost" id="sClose" style="margin-left:auto">Закрыть</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
  var STATE = { leads: [], statuses: [], sources: [], counts: {}, current: null,
                tab: '' };   // '' — все, 'overdue' — просрочено, иначе название статуса

  function $(id) { return document.getElementById(id); }
  function esc(v) { return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(t._h); t._h = setTimeout(function(){ t.hidden = true; }, 2600);
  }
  function busy(on) { document.body.style.cursor = on ? 'progress' : ''; }

  function load() {
    busy(true);
    google.script.run.withSuccessHandler(function (res) {
      busy(false);
      STATE.leads = res.leads; STATE.statuses = res.statuses;
      STATE.sources = res.sources; STATE.counts = res.counts || {};
      STATE.reasons = res.reasons || [];
      $('who').textContent = res.me || '';
      fillSelects();
      renderTabs();
      render();
    }).withFailureHandler(function (e) {
      busy(false);
      $('list').innerHTML = '<div class="empty">Не удалось загрузить: ' + esc(e.message) + '</div>';
    }).apiList({
      q: $('q').value,
      status: (STATE.tab && STATE.tab !== 'overdue') ? STATE.tab : '',
      source: $('fSource').value,
      onlyOverdue: STATE.tab === 'overdue'
    });
  }

  function renderTabs() {
    var items = [{ key: '', label: 'Все' }];
    STATE.statuses.forEach(function (s) { items.push({ key: s, label: s }); });
    items.push({ key: 'overdue', label: 'Просрочено', alarm: true });

    $('tabs').innerHTML = items.map(function (it) {
      var n = STATE.counts[it.key === '' ? '' : it.key];
      var cls = 'tab' + (STATE.tab === it.key ? ' on' : '') + (it.alarm ? ' alarm' : '');
      return '<button class="' + cls + '" data-tab="' + esc(it.key) + '">' + esc(it.label) +
             (n ? '<span class="n">' + n + '</span>' : '') + '</button>';
    }).join('');

    [].forEach.call($('tabs').querySelectorAll('.tab'), function (b) {
      b.addEventListener('click', function () {
        STATE.tab = b.dataset.tab;
        load();
      });
    });
  }

  var selectsReady = false;
  function fillSelects() {
    if (selectsReady) return;
    selectsReady = true;
    STATE.statuses.forEach(function (s) {
      $('cStatus').insertAdjacentHTML('beforeend', '<option>' + esc(s) + '</option>');
    });
    STATE.sources.forEach(function (s) {
      $('fSource').insertAdjacentHTML('beforeend', '<option>' + esc(s) + '</option>');
      $('nSource').insertAdjacentHTML('beforeend', '<option>' + esc(s) + '</option>');
    });
    $('cReason').insertAdjacentHTML('beforeend', '<option value="">—</option>');
    (STATE.reasons || []).forEach(function (s) {
      $('cReason').insertAdjacentHTML('beforeend', '<option>' + esc(s) + '</option>');
    });
    $('nSource').value = 'Telegram';
  }

  function render() {
    if (!STATE.leads.length) {
      $('list').innerHTML = '<div class="empty">Заявок нет. Как только придёт первая — появится здесь.</div>';
      return;
    }
    var rows = STATE.leads.map(function (l, i) {
      return '<tr class="row' + (l.overdue ? ' overdue' : '') + '" data-i="' + i + '">' +
        '<td class="nowrap muted">' + esc(l['Создана']) + '</td>' +
        '<td><b>' + esc(l['Имя'] || '—') + '</b><div class="muted">' + esc(l['Телефон']) + '</div></td>' +
        '<td class="hide-sm">' + esc(l['Источник']) + '</td>' +
        '<td class="hide-sm muted">' + esc((l['Комментарий клиента'] || l['Интересует'] || '').slice(0, 70)) + '</td>' +
        '<td><span class="st ' + esc(l['Статус']) + '">' + esc(l['Статус']) + '</span></td>' +
        '<td class="nowrap' + (l.overdue ? '' : ' muted') + '">' + esc(l['Следующий контакт'] || '—') + '</td>' +
      '</tr>';
    }).join('');
    $('list').innerHTML = '<table><thead><tr>' +
      '<th>Создана</th><th>Клиент</th><th class="hide-sm">Источник</th>' +
      '<th class="hide-sm">Запрос</th><th>Статус</th><th>Связаться</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';

    [].forEach.call(document.querySelectorAll('tr.row'), function (tr) {
      tr.addEventListener('click', function () { openCard(STATE.leads[+tr.dataset.i]); });
    });
  }

  function openCard(l) {
    STATE.current = l;
    $('cName').textContent = l['Имя'] || 'Без имени';
    $('cMeta').textContent = l['ID'] + ' · ' + l['Источник'] + ' · создана ' + l['Создана'];
    var digits = String(l['Телефон']).replace(/\D/g, '');
    $('cCall').textContent = l['Телефон'] || '—';
    $('cCall').href = digits ? 'tel:+' + digits : '#';

    var facts = [];
    ['Комментарий клиента','Интересует','Тип объекта','Площадь, м²','Нагрузка','Основание',
     'Файлы','Акция','utm_source','utm_campaign','Страница входа'].forEach(function (k) {
      if (l[k] !== '' && l[k] != null) facts.push('<div><b>' + esc(k) + '</b><span>' + esc(l[k]) + '</span></div>');
    });
    $('cFacts').innerHTML = facts.join('') || '<div class="muted">Дополнительных данных нет</div>';

    $('cStatus').value = l['Статус'] || 'Новая';
    $('cSum').value = l['Сумма, ₽'] || '';
    $('cNext').value = l['Следующий контакт'] || '';
    $('cOwner').value = l['Ответственный'] || '';
    $('cReason').value = l['Причина отказа'] || '';
    $('cTarget').value = l['Целевая'] || '';
    $('cNote').value = '';
    $('cNotes').textContent = l['Заметки'] || 'Заметок пока нет.';
    $('cardModal').hidden = false;
  }

  function applyUpdated(l) {
    STATE.current = l;
    $('cNotes').textContent = l['Заметки'] || 'Заметок пока нет.';
    $('cNote').value = '';
    load();
  }

  $('cSave').addEventListener('click', function () {
    var l = STATE.current; if (!l) return;
    busy(true); this.disabled = true;
    var btn = this;
    google.script.run.withSuccessHandler(function (res) {
      busy(false); btn.disabled = false; applyUpdated(res); toast('Сохранено');
    }).withFailureHandler(function (e) {
      busy(false); btn.disabled = false; toast('Ошибка: ' + e.message);
    }).apiSave({
      __row: l.__row,
      'Статус': $('cStatus').value,
      'Сумма, ₽': $('cSum').value,
      'Следующий контакт': $('cNext').value,
      'Ответственный': $('cOwner').value,
      'Причина отказа': $('cReason').value,
      'Целевая': $('cTarget').value
    });
  });

  $('cAddNote').addEventListener('click', function () {
    var l = STATE.current; if (!l) return;
    var txt = $('cNote').value.trim();
    if (!txt) { toast('Сначала напишите заметку'); return; }
    busy(true); var btn = this; btn.disabled = true;
    google.script.run.withSuccessHandler(function (res) {
      busy(false); btn.disabled = false; applyUpdated(res); toast('Заметка добавлена');
    }).withFailureHandler(function (e) {
      busy(false); btn.disabled = false; toast('Ошибка: ' + e.message);
    }).apiAddNote(l.__row, txt);
  });

  $('nSave').addEventListener('click', function () {
    var phone = $('nPhone').value.trim();
    if (!phone.replace(/\D/g, '')) { toast('Нужен телефон'); return; }
    busy(true); var btn = this; btn.disabled = true;
    google.script.run.withSuccessHandler(function () {
      busy(false); btn.disabled = false; $('newModal').hidden = true;
      ['nName','nPhone','nType','nArea','nComment'].forEach(function (id) { $(id).value = ''; });
      toast('Заявка создана'); load();
    }).withFailureHandler(function (e) {
      busy(false); btn.disabled = false; toast('Ошибка: ' + e.message);
    }).apiCreate({
      'Имя': $('nName').value.trim(),
      'Телефон': phone,
      'Источник': $('nSource').value,
      'Тип объекта': $('nType').value.trim(),
      'Площадь, м²': $('nArea').value,
      'Комментарий клиента': $('nComment').value.trim()
    });
  });

  function ymd(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function money(n) { return n ? Number(n).toLocaleString('ru-RU') : '—'; }
  function pct(n) { return (n === null || n === undefined) ? '—' : n + '%'; }

  function kpi(value, label, cls) {
    return '<div class="kpi' + (cls ? ' ' + cls : '') + '"><b>' + value + '</b><span>' +
           esc(label) + '</span></div>';
  }

  function tbl(head, rows) {
    if (!rows.length) return '<div class="muted" style="font-size:13px">Нет данных.</div>';
    return '<div class="scroll-x"><table><thead><tr>' +
      head.map(function (h, i) {
        return '<th' + (i ? ' class="num"' : '') + '>' + esc(h) + '</th>';
      }).join('') +
      '</tr></thead><tbody>' +
      rows.map(function (r) {
        return '<tr>' + r.map(function (c, i) {
          return '<td' + (i ? ' class="num"' : '') + '>' + c + '</td>';
        }).join('') + '</tr>';
      }).join('') +
      '</tbody></table></div>';
  }

  function miniChart(items) {
    var max = 0;
    items.forEach(function (i) { if (i.n > max) max = i.n; });
    return '<div class="mini-wrap"><div class="mini">' + items.map(function (i) {
      var h = max ? Math.round(i.n / max * 100) : 0;
      return '<div style="height:' + h + '%" title="' + esc(i.label) + ': ' + i.n + '">' +
             '<span>' + esc(i.label) + '</span></div>';
    }).join('') + '</div></div>';
  }

  function renderStats(d) {
    var t = d.totals;
    var conv = t.leads ? Math.round(t.deals / t.leads * 1000) / 10 : 0;
    var html = [];

    // --- главные цифры
    var cards = [
      kpi(t.leads, 'заявок за период'),
      kpi(t.deals, 'договоров', t.deals ? 'good' : ''),
      kpi(conv + '%', 'конверсия в договор'),
      kpi(money(t.revenue), 'выручка, ₽'),
      kpi(money(t.avgCheck), 'средний чек, ₽'),
      kpi(d.cycle.deals ? d.cycle.avgDays : '—', 'дней от заявки до договора'),
      kpi(d.speed.touched ? fmtMin(d.speed.avgMin) : '—', 'среднее время первого ответа'),
      kpi(d.speed.touched ? Math.round(d.speed.in15 / d.speed.touched * 100) + '%' : '—',
          'ответили за 15 минут'),
      kpi(d.speed.untouched, 'вообще без ответа', d.speed.untouched ? 'warn' : ''),
      kpi(d.stale.d7, 'без движения 7+ дней', d.stale.d7 ? 'warn' : ''),
      kpi(d.stale.d2, 'без движения 2–7 дней'),
      kpi(money(d.area.inWork), 'м² в работе')
    ];
    if (d.spendKnown) {
      cards.push(kpi(money(d.spendTotal), 'расход на рекламу, ₽'));
      cards.push(kpi(money(d.cplTotal), 'цена заявки, ₽'));
      cards.push(kpi(pct(d.romiTotal), 'окупаемость рекламы',
                     d.romiTotal !== null && d.romiTotal < 0 ? 'warn' : 'good'));
    }
    html.push('<div class="sect"><div class="kpis">' + cards.join('') + '</div></div>');

    // --- воронка
    var max = d.funnel.length ? d.funnel[0].count : 0;
    html.push('<div class="sect"><h3>Воронка</h3><div class="fun">' +
      d.funnel.map(function (f) {
        var w = max ? Math.round(f.count / max * 100) : 0;
        return '<div class="fun-row"><span>' + esc(f.stage) + '</span>' +
               '<span class="fun-bar"><i style="width:' + w + '%"></i>' +
               '<em>' + f.count + '</em></span>' +
               '<span class="muted" style="font-size:12.5px">' +
               (f.fromPrev === null ? 'старт' : 'с прошлого шага ' + f.fromPrev + '%') +
               '</span></div>';
      }).join('') + '</div></div>');

    // --- источники и деньги
    var srcHead = ['Источник', 'Заявок', 'Договоров', 'Конверсия', 'Выручка'];
    if (d.spendKnown) srcHead = srcHead.concat(['Расход', 'Цена заявки', 'Цена договора', 'ДРР', 'ROMI']);
    html.push('<div class="sect"><h3>Источники</h3>' + tbl(srcHead, d.sources.map(function (r) {
      var row = [esc(r.key), r.leads, r.deals, r.conv + '%', money(r.revenue)];
      if (d.spendKnown) row = row.concat([money(r.spend), money(r.cpl), money(r.cpa),
                                          r.drr === null ? '—' : r.drr + '%', pct(r.romi)]);
      return row;
    })) + (d.spendKnown ? '' :
      '<div class="muted" style="font-size:12.5px;margin-top:8px">' +
      'Цена заявки и окупаемость появятся, когда на листе «Расходы» будут траты на рекламу.</div>') +
      '</div>');

    // --- реклама по меткам
    var utm = d.utm.filter(function (r) { return r.key && r.key !== '—'; });
    if (utm.length) {
      html.push('<div class="sect"><h3>Рекламные метки (utm_source)</h3>' +
        tbl(['Метка', 'Заявок', 'Договоров', 'Конверсия', 'Выручка'], utm.map(function (r) {
          return [esc(r.key), r.leads, r.deals, r.conv + '%', money(r.revenue)];
        })) + '</div>');
    }

    // --- качество заявок
    html.push('<div class="sect"><h3>Качество заявок</h3><div class="kpis">' +
      kpi(t.target, 'целевых') + kpi(t.nonTarget, 'нецелевых', t.nonTarget ? 'warn' : '') +
      kpi(t.unmarked, 'не размечено') +
      kpi(t.leads - t.nonTarget ? Math.round(t.deals / (t.leads - t.nonTarget) * 1000) / 10 + '%' : '—',
          'конверсия без мусора') +
      '</div></div>');

    // --- отказы
    if (d.reasons.length) {
      html.push('<div class="sect"><h3>Почему отказали</h3>' +
        tbl(['Причина', 'Сколько'], d.reasons.map(function (r) {
          return [esc(r.reason), r.n];
        })) + '</div>');
    }

    // --- менеджеры
    if (d.managers.length > 1 || (d.managers[0] && d.managers[0].key !== 'не назначен')) {
      html.push('<div class="sect"><h3>По менеджерам</h3>' +
        tbl(['Менеджер', 'Заявок', 'Договоров', 'Конверсия', 'Выручка'], d.managers.map(function (r) {
          return [esc(r.key), r.leads, r.deals, r.conv + '%', money(r.revenue)];
        })) + '</div>');
    }

    // --- когда приходят заявки
    html.push('<div class="sect"><h3>Когда приходят заявки</h3>' +
      '<div style="font-size:12.5px;color:var(--ink-3);margin-bottom:6px">По дням недели</div>' +
      miniChart(d.dow) +
      '<div style="font-size:12.5px;color:var(--ink-3);margin:14px 0 6px">По часам</div>' +
      miniChart(d.hours) + '</div>');

    $('sumBody').innerHTML = html.join('');
  }

  function fmtMin(m) {
    if (m < 60) return m + ' мин';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' ч ' + (m % 60) + ' мин';
    return Math.round(h / 24) + ' дн';
  }

  function loadSummary(range) {
    $('sumBody').textContent = 'Считаю…';
    google.script.run.withSuccessHandler(function (d) {
      if (!d.totals.leads) { $('sumBody').textContent = 'За этот период заявок нет.'; return; }
      renderStats(d);
    }).withFailureHandler(function (e) {
      $('sumBody').textContent = 'Ошибка: ' + e.message;
    }).apiStats(range || {});
  }

  function periodRange(p) {
    var now = new Date();
    if (p === 'all') return {};
    if (p === 'month') return { from: ymd(new Date(now.getFullYear(), now.getMonth(), 1)), to: ymd(now) };
    var days = Number(p) || 0;
    var from = new Date(now.getTime() - days * 86400000);
    return { from: ymd(from), to: ymd(now) };
  }

  $('sumBtn').addEventListener('click', function () {
    $('sumModal').hidden = false;
    var r = periodRange('30');
    $('sFrom').value = r.from || ''; $('sTo').value = r.to || '';
    loadSummary(r);
  });

  [].forEach.call(document.querySelectorAll('[data-period]'), function (b) {
    b.addEventListener('click', function () {
      [].forEach.call(document.querySelectorAll('[data-period]'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      var r = periodRange(b.dataset.period);
      $('sFrom').value = r.from || ''; $('sTo').value = r.to || '';
      loadSummary(r);
    });
  });

  $('sApply').addEventListener('click', function () {
    [].forEach.call(document.querySelectorAll('[data-period]'), function (x) { x.classList.remove('on'); });
    loadSummary({ from: $('sFrom').value, to: $('sTo').value });
  });

  $('addBtn').addEventListener('click', function () { $('newModal').hidden = false; });
  $('cClose').addEventListener('click', function () { $('cardModal').hidden = true; });
  $('nClose').addEventListener('click', function () { $('newModal').hidden = true; });
  $('sClose').addEventListener('click', function () { $('sumModal').hidden = true; });
  $('reload').addEventListener('click', load);
  $('fSource').addEventListener('change', load);
  var qt;
  $('q').addEventListener('input', function () { clearTimeout(qt); qt = setTimeout(load, 400); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    ['cardModal','newModal','sumModal'].forEach(function (id) { $(id).hidden = true; });
  });
  [].forEach.call(document.querySelectorAll('.modal'), function (m) {
    m.addEventListener('click', function (e) { if (e.target === m) m.hidden = true; });
  });

  load();
</script>
</body>
</html>
