<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<base target="_top">
<?!= include('CRM_css'); ?>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Заявки</h1>
    <button id="dayBtn">Сегодня</button>
    <button class="ghost" id="addBtn">+ Заявка</button>
    <button class="ghost" id="sumBtn">Аналитика</button>
    <span class="who" id="who"></span>
  </header>
  <div class="tabs" id="tabs"></div>

  <div class="bar">
    <input type="text" id="q" placeholder="Поиск: имя, телефон, заметка" style="min-width:230px">
    <select id="fSource"><option value="">Все источники</option></select>
    <button class="ghost" id="reload">Обновить</button>
  </div>

  <div id="list"><div class="empty">Загружаю…</div></div>
</div>

<!-- карточка клиента -->
<div class="modal" id="cardModal" hidden>
  <div class="card">
    <h2 id="cName">—</h2>
    <div class="sub" id="cMeta"></div>

    <a class="call" id="cCall" href="#">—</a>

    <div class="facts" id="cFacts"></div>

    <div class="grid">
      <div class="f"><label>Статус</label><select id="cStatus"></select></div>
      <div class="f"><label>Источник</label><select id="cSource"></select></div>
      <div class="f"><label>Сумма сделки, ₽</label><input type="number" id="cSum" min="0" step="1000"></div>
      <div class="f"><label>Связаться</label><input type="date" id="cNext"></div>
      <div class="f"><label>Ответственный</label><input type="text" id="cOwner" placeholder="Наталья"></div>
      <div class="f"><label>Причина отказа</label><select id="cReason"></select></div>
      <div class="f"><label>Целевая заявка</label>
        <select id="cTarget">
          <option value="">не размечена</option>
          <option>Да</option>
          <option>Нет</option>
        </select>
      </div>
    </div>

    <div class="f" style="margin-bottom:10px">
      <label>Новая заметка</label>
      <textarea id="cNote" placeholder="Что обсудили, о чём договорились"></textarea>
    </div>
    <div class="notes" id="cNotes">Заметок пока нет.</div>

    <div class="actions">
      <button id="cSave">Сохранить</button>
      <button class="ghost" id="cAddNote">Добавить заметку</button>
      <button class="ghost" id="cClose" style="margin-left:auto">Закрыть</button>
    </div>
  </div>
</div>

<!-- новая заявка вручную -->
<div class="modal" id="newModal" hidden>
  <div class="card">
    <h2>Новая заявка</h2>
    <div class="sub">Для обращений из Telegram, MAX или по телефону</div>
    <div class="grid">
      <div class="f"><label>Имя</label><input type="text" id="nName"></div>
      <div class="f"><label>Телефон *</label><input type="text" id="nPhone" placeholder="+7 (___) ___-__-__"></div>
      <div class="f"><label>Источник</label><select id="nSource"></select></div>
      <div class="f"><label>Тип объекта</label><input type="text" id="nType" placeholder="Склад, цех, паркинг"></div>
      <div class="f"><label>Площадь, м²</label><input type="number" id="nArea" min="0"></div>
    </div>
    <div class="f" style="margin-bottom:10px">
      <label>Комментарий</label>
      <textarea id="nComment" placeholder="Что просит клиент"></textarea>
    </div>
    <div class="actions">
      <button id="nSave">Создать</button>
      <button class="ghost" id="nClose" style="margin-left:auto">Отмена</button>
    </div>
  </div>
</div>

<!-- задачи на сегодня -->
<div class="modal" id="dayModal" hidden>
  <div class="card">
    <h2>Задачи на сегодня</h2>
    <div class="sub" id="dSub">—</div>
    <div id="dayBody">Загружаю…</div>
    <div class="actions"><button class="ghost" id="dClose" style="margin-left:auto">Закрыть</button></div>
  </div>
</div>

<!-- сводка -->
<div class="modal" id="sumModal" hidden>
  <div class="card card--wide">
    <h2>Аналитика</h2>
    <div class="sub">Считается по заявкам, созданным за выбранный период</div>

    <div class="bar" style="margin-bottom:12px">
      <button class="chip on" data-period="30">30 дней</button>
      <button class="chip" data-period="7">7 дней</button>
      <button class="chip" data-period="0">Сегодня</button>
      <button class="chip" data-period="month">Этот месяц</button>
      <button class="chip" data-period="all">Всё время</button>
    </div>
    <div class="bar" style="margin-bottom:14px">
      <label class="muted" style="align-self:center">с</label>
      <input type="date" id="sFrom">
      <label class="muted" style="align-self:center">по</label>
      <input type="date" id="sTo">
      <button class="ghost" id="sApply">Показать</button>
    </div>

    <div class="bar" id="sGroups" style="margin-bottom:8px"></div>
    <div class="picks" id="sPicks"></div>

    <div id="sumBody">Считаю…</div>
    <div class="actions"><button class="ghost" id="sClose" style="margin-left:auto">Закрыть</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<?!= include('CRM_js'); ?>
</body>
</html>
